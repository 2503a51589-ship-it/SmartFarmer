{% extends "base.html" %}
{% block title %}Unified Portal Login - SIH26032{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card-custom p-4 p-md-5 bg-white shadow-sm">
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="Emblem" width="56" height="56" class="mb-2">
                    <h3 class="fw-bold text-success">Portal Login</h3>
                    <p class="text-muted small">Select your role and sign in to your dashboard</p>
                </div>

                <!-- Test Credentials Quick Selector Chips -->
                <div class="p-3 bg-light rounded mb-3 border">
                    <div class="small fw-bold text-secondary mb-2"><i class="bi bi-key-fill text-warning me-1"></i> Quick Test Accounts (1-Click Fill):</div>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-sm btn-outline-success" onclick="fillCreds('farmer1', 'farmer123', 'farmer')">Farmer Demo</button>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="fillCreds('operator1', 'operator123', 'operator')">Operator Demo</button>
                        <button type="button" class="btn btn-sm btn-outline-dark" onclick="fillCreds('admin', 'admin123', 'admin')">Admin Demo</button>
                    </div>
                </div>

                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Login Role</label>
                        <select name="role" id="role_select" class="form-select" required>
                            <option value="farmer" selected>Farmer (Kisan Portal)</option>
                            <option value="operator">Procurement Center Operator</option>
                            <option value="admin">System / Department Admin</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username / Mobile Number</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" id="username_input" class="form-control" placeholder="Enter username" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" id="password_input" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold shadow-sm"><i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Portal</button>
                </form>

                <hr class="my-4">
                <div class="text-center small text-muted">
                    New farmer? <a href="{{ url_for('register') }}" class="text-success fw-bold text-decoration-none">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillCreds(u, p, r) {
    document.getElementById('username_input').value = u;
    document.getElementById('password_input').value = p;
    document.getElementById('role_select').value = r;
}
</script>
{% endblock %}
