{% extends "base.html" %}
{% block title %}Farmer Profile - SIH26032{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card-custom p-4 p-md-5 bg-white shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                    <div>
                        <span class="badge bg-success-subtle text-success px-3 py-1 rounded-pill fw-bold">KISAN IDENTITY</span>
                        <h3 class="fw-bold text-success mb-0"><i class="bi bi-person-badge me-2"></i>Farmer Profile & Bank Settings</h3>
                    </div>
                    <a href="{{ url_for('farmer_dashboard') }}" class="btn btn-outline-secondary btn-sm">Dashboard</a>
                </div>

                <form action="{{ url_for('farmer_profile') }}" method="POST">
                    <h5 class="fw-bold text-dark border-bottom pb-2 mb-3"><i class="bi bi-person-circle text-success me-2"></i> Personal Information</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Farmer Registration ID (UID)</label>
                            <input type="text" class="form-control bg-light" value="{{ farmer.farmer_uid }}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input type="text" name="full_name" class="form-control" value="{{ farmer.full_name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Mobile Number</label>
                            <input type="tel" name="mobile_number" class="form-control" value="{{ farmer.mobile_number }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Land Size (Acres)</label>
                            <input type="number" step="0.1" name="land_size_acres" class="form-control" value="{{ farmer.land_size_acres }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Village</label>
                            <input type="text" name="village" class="form-control" value="{{ farmer.village }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">District</label>
                            <input type="text" name="district" class="form-control" value="{{ farmer.district }}" required>
                        </div>
                    </div>

                    <h5 class="fw-bold text-dark border-bottom pb-2 mb-3"><i class="bi bi-bank text-primary me-2"></i> Direct Benefit Transfer (DBT) Bank Account</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Bank Account Number</label>
                            <input type="text" name="bank_account_no" class="form-control" value="{{ farmer.bank_account_no }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">IFSC Code</label>
                            <input type="text" name="ifsc_code" class="form-control" value="{{ farmer.ifsc_code }}" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success px-4 fw-bold shadow-sm"><i class="bi bi-save me-2"></i> Update Profile Details</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
